name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'js/**'
      - 'assets/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sync web assets
        shell: bash
        run: |
          DEST=android/app/src/main/assets/www
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp index.html manifest.webmanifest sw.js "$DEST"/
          cp -R assets js "$DEST"/

      - name: Build APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: jiyi-android-apks
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
