name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'js/**'
      - 'assets/**'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    # Pin the runner image so the automatic ubuntu-latest migration cannot
    # change the Android/JDK toolchain underneath a release build.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Cache Android debug keystore
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: jiyi-debug-keystore-v1

      - name: Sync web assets
        shell: bash
        run: |
          DEST=android/app/src/main/assets/www
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp index.html manifest.webmanifest sw.js "$DEST"/
          cp -R assets js "$DEST"/

      - name: Build APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: jiyi-android-apks
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
